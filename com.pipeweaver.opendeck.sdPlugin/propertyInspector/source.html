<!doctype html><html><head><meta charset="utf-8"><title>PipeWeaver Source</title><style>html,body{margin:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small{color:#999}</style><script>let websocket,context,settings={},info,isMute=false;function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);context=u;info=JSON.parse(ai);settings=info.payload.settings||{};isMute=info.action==="com.pipeweaver.opendeck.sourcemute";websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getTargets"}}))};websocket.onmessage=ev=>{try{let m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="targets")populate(m.payload)}catch(_){}};init()}function init(){document.getElementById("source").value=settings.sourceName||"";document.getElementById("mix").value=settings.mix||"A";document.getElementById("stepRow").style.display=isMute?"none":"flex";document.getElementById("step").value=settings.step||"5"}function save(){const payload={sourceName:source.value,mix:mix.value};if(!isMute)payload.step=step?.value||5;websocket.send(JSON.stringify({event:"setSettings",context:info.context,payload}))}function populate(d){let x=source.value||settings.sourceName||"";source.innerHTML='<option value="">Select source…</option>';(d.sources||[]).forEach(n=>{let o=document.createElement("option");o.value=n;o.textContent=n;source.appendChild(o)});source.value=x} </script></head><body><div class="row"><label>Source</label><select id="source" onchange="save()"><option>Loading…</option></select></div><div class="row"><label>Channel</label><select id="mix" onchange="save()"><option value="A">A</option><option value="B">B</option></select></div><div class="row" id="stepRow"><label>Step %</label><input id="step" type="number" min="1" max="100" value="5" onchange="save()"></div><small>Controls the selected PipeWeaver source channel.</small></body></html>
