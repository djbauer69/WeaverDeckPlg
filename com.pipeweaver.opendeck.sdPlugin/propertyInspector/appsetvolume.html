<!doctype html><html><head><meta charset="utf-8"><title>Set Application Volume</title><style>html,body{margin:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small,#status{color:#999}</style><script>let websocket,info,settings={};function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);info=JSON.parse(ai);settings=info.payload?.settings||{};websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getApplications"}}))};websocket.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="applications")pop(m.payload.applications||[])}catch(_){}};volume.value=settings.volume??50}function pop(xs){app.innerHTML='<option value="">Select application…</option>';xs.forEach(a=>{const v=JSON.stringify({name:a.name||"",process:a.process||""});app.add(new Option(a.process?`${a.name} — ${a.process}`:a.name,v))});const m=xs.find(a=>a.name===settings.name&&(!settings.process||a.process===settings.process));if(m)app.value=JSON.stringify({name:m.name,process:m.process||""})}function save(){let a={};try{a=JSON.parse(app.value)}catch(_){}websocket.send(JSON.stringify({event:"setSettings",context:info.context,payload:{name:a.name||"",process:a.process||"",volume:volume.value}}))}</script></head><body><div class="row"><label>Application</label><select id="app" onchange="save()"><option>Loading…</option></select></div><div class="row"><label>Volume %</label><input id="volume" type="number" min="0" max="100" onchange="save()"></div><small>Requires the application to be currently reported by PipeWeaver.</small></body></html>
