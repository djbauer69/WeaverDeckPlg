<!doctype html><html><head><meta charset="utf-8"><title>Set Application Volume</title><style>html,body{margin:0;padding:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px;box-sizing:border-box}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small,#status{color:#999}#status{margin:8px 0;line-height:1.35}</style><script src="app-identity-v017.js"></script><script>
let websocket,info,settings={};
function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);info=JSON.parse(ai);settings=info.payload?.settings||{};websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));requestApps()};websocket.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="applications")populate(m.payload.applications||[])}catch(_){}};volume.value=settings.volume??50;buttonText.value=settings.buttonText||""}
function requestApps(){websocket?.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getApplications"}}))}
function populate(apps){const I=WeaverAppIdentity,current=I.descriptor(settings);app.innerHTML='<option value="">Select application…</option>';apps.forEach(a=>app.add(new Option(I.label(a),I.value(a))));const m=I.find(apps,current);if(m){app.value=I.value(m);status.textContent="Configured application is running."}else if(current?.name){I.addConfiguredOption(app,current);status.textContent="Configured application is not running; selection preserved."}else status.textContent=apps.length?`${apps.length} application(s) found.`:"No applications currently reported."}
function save(){let a={};try{a=JSON.parse(app.value)}catch(_){};settings={...settings,name:a.name||"",process:a.process||"",deviceType:a.deviceType||"",volume:volume.value,buttonText:buttonText.value};websocket?.send(JSON.stringify({event:"setSettings",context:info.context,payload:settings}))}
</script></head><body><div class="row"><label>Application</label><select id="app" onchange="save()"><option>Loading…</option></select></div><div class="row"><label>Volume %</label><input id="volume" type="number" min="0" max="100" onchange="save()"></div><div class="row"><label>Button Text</label><input id="buttonText" type="text" placeholder="Blank = dynamic text" onchange="save()"></div><div id="status">Querying PipeWeaver…</div><small>The configured application remains selected while offline and reconnects automatically when identity resolution is unambiguous.</small></body></html>
