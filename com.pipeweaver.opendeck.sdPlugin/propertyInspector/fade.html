<!doctype html><html><head><meta charset="utf-8"><title>Volume Fade</title>
<style>body{background:#222;color:#eee;font:13px sans-serif;margin:12px}label{display:block;margin-top:12px}input,select{box-sizing:border-box;width:100%;padding:7px;background:#333;color:#fff;border:1px solid #666}small{display:block;margin-top:14px;color:#bbb}</style>
<script src="fade-ui.js"></script><script defer src="fade.js"></script></head><body>
<label for="selection">Device / Application</label><select id="selection"><option value="">Select…</option></select>
<div id="mixRow"><label for="mix">Source mix</label><select id="mix"><option>A</option><option>B</option></select></div>
<label for="volume">Fade to volume %</label><input id="volume" type="number" min="0" max="100" step="1" value="0">
<label for="seconds">Duration in seconds</label><input id="seconds" type="number" min="0" max="120" step="0.1" value="3">
<small>Fades from the current volume. Zero seconds applies immediately. Mute is unchanged. A new fade or volume adjustment takes over; changing volume externally stops the fade. Source fades follow PipeWeaver’s volume-link setting.</small>
<div id="status"></div></body></html>
