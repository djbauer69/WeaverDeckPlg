<!doctype html><html><head><meta charset="utf-8"><title>PipeWeaver Status</title><style>html,body{margin:0;padding:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px;box-sizing:border-box}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select,textarea{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}textarea{min-height:150px;resize:vertical}small{color:#999}#status{margin:8px 0;color:#aaa}</style><script>let websocket,context,settings={};function connectElgatoStreamDeckSocket(inPort,inPropertyInspectorUUID,inRegisterEvent,inInfo,inActionInfo){websocket=new WebSocket("ws://localhost:"+inPort);context=inPropertyInspectorUUID;const info=JSON.parse(inActionInfo);settings=info.payload.settings||{};window.piInfo=info;websocket.onopen=()=>{websocket.send(JSON.stringify({event:inRegisterEvent,uuid:inPropertyInspectorUUID}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:"getDevices"}))};websocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="sendToPropertyInspector")populate(m.payload)}catch(_){}};init()}function sendSettings(){websocket?.send(JSON.stringify({event:"setSettings",context:window.piInfo.context,payload:collect()}))}function init(){}function collect(){return{}}function populate(d){}</script></head><body><div id="status">PipeWeaver status action.</div><small>Press the key to test the PipeWeaver API connection.</small></body></html>
