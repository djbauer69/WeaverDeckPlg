<!doctype html><html><head><meta charset="utf-8"><title>Application Route</title><style>html,body{margin:0;padding:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px;box-sizing:border-box}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small,#status{color:#999}#status{margin:8px 0;line-height:1.35}</style><script src="app-identity-v017.js"></script><script>
let websocket,info,settings={},data={targets:[],sources:[],applications:[]};
function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);info=JSON.parse(ai);settings=info.payload?.settings||{};websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));request()};websocket.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="targets"){data=m.payload;populate()}}catch(_){}};buttonText.value=settings.buttonText||""}
function request(){websocket?.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getTargets"}}))}
function selectedApp(){try{return JSON.parse(app.value)}catch(_){return {}}}
function fillDest(a){const type=WeaverAppIdentity.typeKey(a?.deviceType||settings.deviceType||"Source"),list=type==="target"?(data.targets||[]):(data.sources||[]);target.innerHTML='<option value="">Select PipeWeaver channel…</option>';list.forEach(n=>target.add(new Option(n,n)));if(list.includes(settings.targetName||""))target.value=settings.targetName||""}
function populate(){const I=WeaverAppIdentity,apps=data.applications||[],current=I.descriptor(settings);app.innerHTML='<option value="">Select application…</option>';apps.forEach(a=>app.add(new Option(I.label(a),I.value(a))));const m=I.find(apps,current);if(m){app.value=I.value(m);fillDest(m);status.textContent="Configured application is running."}else if(current?.name){I.addConfiguredOption(app,current);fillDest(current);status.textContent="Configured application is not running; route selection preserved."}else{fillDest({deviceType:settings.deviceType||"Source"});status.textContent=apps.length?`${apps.length} application(s) found.`:"No applications currently reported."}}
function appChanged(){const a=selectedApp();settings.targetName="";fillDest(a);save()}
function save(){const a=selectedApp();settings={name:a.name||"",process:a.process||"",deviceType:a.deviceType||settings.deviceType||"",targetName:target.value,buttonText:buttonText.value};websocket?.send(JSON.stringify({event:"setSettings",context:info.context,payload:settings}))}
</script></head><body><div class="row"><label>Application</label><select id="app" onchange="appChanged()"><option>Loading…</option></select></div><div class="row"><label>Route to</label><select id="target" onchange="save()"><option>Loading…</option></select></div><div class="row"><label>Button Text</label><input id="buttonText" type="text" placeholder="Blank = dynamic text" onchange="save()"></div><div id="status">Querying PipeWeaver…</div><small>Playback applications route to Sources; capture applications route to Targets. Offline selections are retained.</small></body></html>
