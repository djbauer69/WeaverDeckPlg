<!doctype html><html><head><meta charset="utf-8"><title>Application Route</title><style>html,body{margin:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small,#status{color:#999}</style><script>let websocket,info,settings={},data={targets:[],sources:[],applications:[]};function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);info=JSON.parse(ai);settings=info.payload?.settings||{};websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getTargets"}}))};websocket.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="targets"){data=m.payload;pop()}}catch(_){}};setTimeout(()=>{buttonText.value=settings.buttonText||""},0)}function selectedApp(){try{return JSON.parse(app.value)}catch(_){return {}}}function fillDest(a){const type=String(a.deviceType||settings.deviceType||"Source").toLowerCase();const list=type==="target"?(data.targets||[]):(data.sources||[]);target.innerHTML='<option value="">Select PipeWeaver channel…</option>';list.forEach(n=>target.add(new Option(n,n)));if(list.includes(settings.targetName||""))target.value=settings.targetName||""}function pop(){app.innerHTML='<option value="">Select application…</option>';(data.applications||[]).forEach(a=>{const v=JSON.stringify({name:a.name||"",process:a.process||"",deviceType:a.deviceType||""});const kind=String(a.deviceType||"").toLowerCase()==="target"?"capture":"playback";app.add(new Option(a.process?`${a.name} — ${a.process} (${kind})`:`${a.name} (${kind})`,v))});const m=(data.applications||[]).find(a=>a.name===settings.name&&(!settings.process||a.process===settings.process)&&(!settings.deviceType||String(a.deviceType).toLowerCase()===String(settings.deviceType).toLowerCase()));if(m){app.value=JSON.stringify({name:m.name,process:m.process||"",deviceType:m.deviceType||""});fillDest(m)}else fillDest({deviceType:settings.deviceType||"Source"})}function appChanged(){const a=selectedApp();settings.targetName="";fillDest(a);save()}function save(){const a=selectedApp();settings={name:a.name||"",process:a.process||"",deviceType:a.deviceType||"",targetName:target.value,buttonText:buttonText.value};websocket.send(JSON.stringify({event:"setSettings",context:info.context,payload:settings}))}</script></head><body><div class="row"><label>Application</label><select id="app" onchange="appChanged()"><option>Loading…</option></select></div><div class="row"><label>Route to</label><select id="target" onchange="save()"><option>Loading…</option></select></div><div class="row"><label>Button Text</label><input id="buttonText" type="text" placeholder="Blank = dynamic text" onchange="save()"></div><small>Playback applications route to PipeWeaver Sources; capture applications route to PipeWeaver Targets.</small></body></html>
