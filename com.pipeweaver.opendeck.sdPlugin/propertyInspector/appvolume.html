<!doctype html><html><head><meta charset="utf-8"><title>PipeWeaver Application Volume</title><style>html,body{margin:0;padding:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px;box-sizing:border-box}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select,textarea{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}textarea{min-height:150px;resize:vertical}small{color:#999}#status{margin:8px 0;color:#aaa}</style><script>let websocket,context,settings={};function connectElgatoStreamDeckSocket(inPort,inPropertyInspectorUUID,inRegisterEvent,inInfo,inActionInfo){websocket=new WebSocket("ws://localhost:"+inPort);context=inPropertyInspectorUUID;const info=JSON.parse(inActionInfo);settings=info.payload.settings||{};window.piInfo=info;websocket.onopen=()=>{websocket.send(JSON.stringify({event:inRegisterEvent,uuid:inPropertyInspectorUUID}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:"getApplications"}))};websocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="sendToPropertyInspector")populate(m.payload)}catch(_){}};init()}function sendSettings(){websocket?.send(JSON.stringify({event:"setSettings",context:window.piInfo.context,payload:collect()}))}function init(){document.getElementById("step").value=settings.step||"5";document.getElementById("buttonText").value=settings.buttonText||""}function collect(){let a={};try{a=JSON.parse(document.getElementById("app").value)}catch(_){}return{name:a.name||"",process:a.process||"",step:document.getElementById("step").value,buttonText:document.getElementById("buttonText").value}}function populate(d){if(d.command!=="applications")return;const s=document.getElementById("app"),old=settings.name||"";s.innerHTML='<option value="">Select PipeWeaver application…</option>';(d.applications||[]).forEach(a=>{const o=document.createElement("option");o.value=JSON.stringify({name:a.name||"",process:a.process||""});o.textContent=a.process?`${a.name} — ${a.process}`:a.name;s.appendChild(o)});const m=(d.applications||[]).find(a=>a.name===old&&(!settings.process||a.process===settings.process));if(m)s.value=JSON.stringify({name:m.name,process:m.process||""});document.getElementById("status").textContent=d.applications?.length?`${d.applications.length} application(s) found.`:"No applications currently reported."}function save(){sendSettings()}</script></head><body><div class="row"><label>Application</label><select id="app" onchange="save()"><option>Loading…</option></select></div><div class="row"><label>Step %</label><input id="step" type="number" min="1" max="100" onchange="save()"></div><div class="row"><label>Button Text</label><input id="buttonText" type="text" placeholder="Blank = dynamic text" onchange="save()"></div><div id="status">Querying PipeWeaver…</div><small>Application volume is controlled through PipeWeaver only.</small></body></html>
