<!doctype html>
<html><head><meta charset="utf-8"><title>PipeWeaver Route</title>
<style>
html,body { margin:0; padding:0; background:#1e1e1e; color:#eee; font:13px sans-serif; }
body { padding:12px; box-sizing:border-box; }
.row { display:flex; align-items:center; margin-bottom:10px; gap:8px; }
label { width:90px; color:#bbb; }
input,select { flex:1; min-width:0; box-sizing:border-box; background:#2a2a2a; color:#fff; border:1px solid #555; border-radius:4px; padding:7px; }
small { color:#999; }
</style>
<script>
let websocket;
let context;
let settings = {};

function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
  websocket = new WebSocket("ws://localhost:" + inPort);
  context = inPropertyInspectorUUID;
  const info = JSON.parse(inActionInfo);
  settings = info.payload.settings || {};
  websocket.onopen = () => websocket.send(JSON.stringify({
    event: inRegisterEvent,
    uuid: inPropertyInspectorUUID
  }));
  window.piInfo = info;
  window.sendSettings = function() {
    websocket.send(JSON.stringify({
      event: "setSettings",
      context: info.context,
      payload: collect()
    }));
  };
  websocket.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.event === "sendToPropertyInspector" && msg.payload?.command === "targets") {
        window.populate(msg.payload);
      }
    } catch (_) {}
  };
  init();
  requestLists();
}

function requestLists() {
  setTimeout(() => {
    websocket?.send(JSON.stringify({
      event: "sendToPlugin",
      context: window.piInfo.context,
      payload: {command:"getTargets"}
    }));
  }, 50);
}


function init() {
  document.getElementById("source").value = settings.sourceName || "";
  document.getElementById("target").value = settings.targetName || "";
}
function collect() { return {sourceName: document.getElementById("source").value, targetName: document.getElementById("target").value}; }
function populate(data) {
  const ss=document.getElementById("source"), st=document.getElementById("target");
  const so=ss.value, to=st.value;
  ss.innerHTML='<option value="">Select source…</option>';
  (data.sources||[]).forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;ss.appendChild(o);});
  st.innerHTML='<option value="">Select target…</option>';
  (data.targets||[]).forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;st.appendChild(o);});
  ss.value=so||settings.sourceName||""; st.value=to||settings.targetName||"";
}
function save(){sendSettings();}

</script></head><body>PipeWeaver Route

<div class="row"><label>Source</label><select id="source" onchange="save()"><option>Selecting…</option></select></div>
<div class="row"><label>Target</label><select id="target" onchange="save()"><option>Selecting…</option></select></div>
<small>Toggle the PipeWeaver route.</small>
</body></html>
