<!doctype html><html><head><meta charset="utf-8"><title>Button Settings</title>
<style>
/* Use normal document scrolling: no viewport-height grid or inner scroll box
   whose cached size can outlive OpenDeck hiding/revealing this inspector. */
html{margin:0;overflow-y:auto;background:#1e1e1e;scrollbar-gutter:stable}
body{min-width:0;margin:0;background:#1e1e1e;color:#ddd;font:13px sans-serif}
header{position:sticky;top:0;z-index:10;background:#2d2d2d;padding:9px 10px;border-bottom:1px solid #555}
.meta{display:grid;grid-template-columns:62px minmax(0,1fr);gap:7px;align-items:center}
label{color:#bbb}
.action-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
#inspector{display:block;box-sizing:border-box;width:100%;min-width:0;min-height:0;border:0}
</style>
<script src="button-inspectors.js"></script><script src="inspector-layout.js"></script><script defer src="button-settings.js"></script></head><body>
<header><div class="meta"><label>Action</label><div id="actionName" class="action-name">Loading…</div></div></header>
<iframe id="inspector" title="Action settings"></iframe></body></html>
