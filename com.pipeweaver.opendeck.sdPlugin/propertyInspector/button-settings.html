<!doctype html><html><head><meta charset="utf-8"><title>Button Settings</title>
<style>
/* Hidden inspectors may first appear in a short viewport. Give the content
   track a zero minimum so the iframe scrolls instead of overflowing it. */
html{width:100%;height:100%;margin:0;overflow:hidden;background:#2d2d2d}
body{display:grid;grid-template-rows:auto minmax(0,1fr);width:100%;height:100vh;min-height:0;margin:0;overflow:hidden;background:#2d2d2d;color:#ddd;font:13px sans-serif}
header{padding:9px 10px;border-bottom:1px solid #555}
.meta{display:grid;grid-template-columns:62px minmax(0,1fr);gap:7px;align-items:center}
label{color:#bbb}
.action-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
#inspector{display:block;box-sizing:border-box;width:100%;height:100%;min-width:0;min-height:0;border:0}
</style>
<script src="button-inspectors.js"></script><script defer src="button-settings.js"></script></head><body>
<header><div class="meta"><label>Action</label><div id="actionName" class="action-name">Loading…</div></div></header>
<iframe id="inspector" title="Action settings"></iframe></body></html>
