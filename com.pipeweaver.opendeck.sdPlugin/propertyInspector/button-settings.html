<!doctype html><html><head><meta charset="utf-8"><title>Button Settings</title>
<style>html,body{height:100%}body{display:flex;flex-direction:column;margin:0;background:#2d2d2d;color:#ddd;font:13px sans-serif}header{flex:none;padding:12px;border-bottom:1px solid #555}label{display:block;margin:6px 0}select,textarea{box-sizing:border-box;width:100%;background:#444;color:#fff;border:1px solid #666;padding:6px}textarea{resize:vertical}small{display:block;margin-top:6px;color:#bbb}iframe{display:block;width:100%;flex:1;min-height:200px;border:0}#manual[hidden]{display:none}</style>
<script src="button-inspectors.js"></script><script defer src="button-settings.js"></script></head><body>
<header><label for="textMode">Button Text</label><select id="textMode" disabled><option value="dynamic">Dynamic Text</option><option value="manual">Manual Input</option></select><div id="manual" hidden><label for="manualText">Manual Input</label><textarea id="manualText" rows="2" disabled placeholder="Enter your button label"></textarea></div><small id="help">Dynamic Text follows the action status. Volume percentages remain visible in either mode.</small></header>
<iframe id="inspector" title="Action settings"></iframe></body></html>
