<!doctype html><html><head><meta charset="utf-8"><title>Physical Device</title><style>html,body{margin:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small,#status{color:#999}</style><script>let websocket,info,settings={},input=false,mute=false;function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);info=JSON.parse(ai);settings=info.payload?.settings||{};input=info.action.includes("physin");mute=info.action.includes("mute");websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getDevices"}}))};websocket.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="devices")pop(input?m.payload.inputs:m.payload.outputs)}catch(_){}};kind.textContent=input?"Input":"Output";stepRow.style.display=mute?"none":"flex";step.value=settings.step||5}function pop(xs){const old=settings.deviceId||"";device.innerHTML='<option value="">Select device…</option>';(xs||[]).forEach(x=>device.add(new Option(x.name,x.id)));device.value=old}function save(){const o=device.options[device.selectedIndex];const p={deviceId:device.value,deviceName:o?.text||""};if(!mute)p.step=step.value;websocket.send(JSON.stringify({event:"setSettings",context:info.context,payload:p}))}</script></head><body><div class="row"><label id="kind">Device</label><select id="device" onchange="save()"><option>Loading…</option></select></div><div class="row" id="stepRow"><label>Step %</label><input id="step" type="number" min="1" max="100" onchange="save()"></div><small>Controls the selected physical device through PipeWeaver.</small></body></html>
