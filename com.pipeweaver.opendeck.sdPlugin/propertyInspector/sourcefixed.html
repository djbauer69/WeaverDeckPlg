<!doctype html><html><head><meta charset="utf-8"><title>PipeWeaver Source</title><style>html,body{margin:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small,#status{color:#999}</style><script>let websocket,info,settings={},mute=false;function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);info=JSON.parse(ai);settings=info.payload?.settings||{};mute=info.action.includes("sourcemute");websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getTargets"}}))};websocket.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="targets")pop(m.payload.sources||[])}catch(_){}};stepRow.style.display=mute?"none":"flex";step.value=settings.step||5}function pop(xs){const old=settings.sourceName||"";source.innerHTML='<option value="">Select source…</option>';xs.forEach(n=>source.add(new Option(n,n)));source.value=old}function save(){const p={sourceName:source.value};if(!mute)p.step=step.value;websocket.send(JSON.stringify({event:"setSettings",context:info.context,payload:p}))}</script></head><body><div class="row"><label>Source</label><select id="source" onchange="save()"><option>Loading…</option></select></div><div class="row" id="stepRow"><label>Step %</label><input id="step" type="number" min="1" max="100" onchange="save()"></div><small>Channel A/B is fixed by the selected action.</small></body></html>
