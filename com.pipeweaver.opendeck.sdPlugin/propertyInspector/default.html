<!doctype html><html><head><meta charset="utf-8"><title>PipeWeaver Default Device</title><style>html,body{margin:0;padding:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px;box-sizing:border-box}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select,textarea{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small{color:#999}</style><script>let websocket,settings={},deviceData={outputs:[],inputs:[]};function connectElgatoStreamDeckSocket(p,u,r,ir,ar){websocket=new WebSocket("ws://localhost:"+p);const info=JSON.parse(ar);settings=info.payload.settings||{};window.piInfo=info;websocket.onopen=()=>{websocket.send(JSON.stringify({event:r,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getDevices"}}))};websocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="devices"){deviceData=m.payload;populate()}}catch(_){}};init()}function init(){document.getElementById("type").value=settings.type||"output"}function collect(){const s=document.getElementById("device");return{type:document.getElementById("type").value,deviceId:s.value,deviceName:s.options[s.selectedIndex]?.text||""}}function populate(){const list=document.getElementById("type").value==="input"?deviceData.inputs:deviceData.outputs;const s=document.getElementById("device"),old=settings.deviceId||"";s.innerHTML='<option value="">Select physical device…</option>';list.forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.name;s.appendChild(o)});s.value=old}function typeChanged(){populate();save()}function save(){websocket?.send(JSON.stringify({event:"setSettings",context:window.piInfo.context,payload:collect()}))}</script></head><body><div class="row"><label>Type</label><select id="type" onchange="typeChanged()"><option value="output">Output</option><option value="input">Input</option></select></div><div class="row"><label>Device</label><select id="device" onchange="save()"><option>Loading…</option></select></div><small>Sets PipeWeaver's default input or output.</small></body></html>
