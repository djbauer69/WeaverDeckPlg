<!doctype html><html><head><meta charset="utf-8"><title>PipeWeaver Target Mix</title><style>html,body{margin:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}select{flex:1;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}</style><script>let websocket,context,settings={},info;function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);context=u;info=JSON.parse(ai);settings=info.payload.settings||{};websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getTargets"}}))};websocket.onmessage=ev=>{try{let m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="targets")populate(m.payload)}catch(_){}};document.getElementById("target").value=settings.targetName||""}function populate(d){let x=target.value||settings.targetName||"";target.innerHTML='<option value="">Select target…</option>';(d.targets||[]).forEach(n=>{let o=document.createElement("option");o.value=n;o.textContent=n;target.appendChild(o)});target.value=x}function save(){websocket.send(JSON.stringify({event:"setSettings",context:info.context,payload:{targetName:target.value}}))}</script></head><body><div class="row"><label>Target</label><select id="target" onchange="save()"><option>Loading…</option></select></div></body></html>
