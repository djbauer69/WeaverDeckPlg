<!doctype html><html><head><meta charset="utf-8"><title>PipeWeaver Source Volume Link</title><style>html,body{margin:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}select{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}.hint{color:#999;font-size:12px;line-height:1.4}</style><script>let websocket,info,settings={};function connectElgatoStreamDeckSocket(p,u,e,ii,ai){websocket=new WebSocket("ws://localhost:"+p);info=JSON.parse(ai);settings=info.payload?.settings||{};websocket.onopen=()=>{websocket.send(JSON.stringify({event:e,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getTargets"}}))};websocket.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="targets")populate(m.payload)}catch(_){}}}function populate(d){const keep=settings.sourceName||source.value||"";const list=(d.sceneSources&&d.sceneSources.length?d.sceneSources:d.sources)||[];source.innerHTML='<option value="">Select source…</option>';list.forEach(n=>source.add(new Option(n,n)));source.value=keep}function save(){settings.sourceName=source.value;websocket?.send(JSON.stringify({event:"setSettings",context:info.context,payload:{sourceName:source.value}}))}</script></head><body><div class="row"><label>Source</label><select id="source" onchange="save()"><option>Loading…</option></select></div><div class="hint">Press the key to toggle PipeWeaver's A/B volume link for this Source. When linked, PipeWeaver preserves the current A/B ratio. Existing Source A/B volume buttons continue to send their normal commands; PipeWeaver applies the linked behavior.</div></body></html>
