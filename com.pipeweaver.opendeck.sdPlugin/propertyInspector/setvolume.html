<!doctype html><html><head><meta charset="utf-8"><title>Set PipeWeaver Volume</title><style>html,body{margin:0;padding:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px;box-sizing:border-box}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}label{width:90px;color:#bbb}input,select,textarea{flex:1;min-width:0;box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}small{color:#999}</style><script>let websocket,settings={};function connectElgatoStreamDeckSocket(p,u,r,ir,ar){websocket=new WebSocket("ws://localhost:"+p);const info=JSON.parse(ar);settings=info.payload.settings||{};window.piInfo=info;websocket.onopen=()=>{websocket.send(JSON.stringify({event:r,uuid:u}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getTargets"}}))};websocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="targets")populate(m.payload)}catch(_){}};init()}function init(){document.getElementById("volume").value=settings.volume??"50"}function collect(){return{targetName:document.getElementById("target").value,volume:document.getElementById("volume").value}}function populate(d){const s=document.getElementById("target"),old=settings.targetName||"";s.innerHTML='<option value="">Select PipeWeaver target…</option>';(d.targets||[]).forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;s.appendChild(o)});s.value=old}function save(){websocket?.send(JSON.stringify({event:"setSettings",context:window.piInfo.context,payload:collect()}))}</script></head><body><div class="row"><label>Target</label><select id="target" onchange="save()"><option>Loading…</option></select></div><div class="row"><label>Volume %</label><input id="volume" type="number" min="0" max="100" onchange="save()"></div><small>Sets the target volume through PipeWeaver only.</small></body></html>
