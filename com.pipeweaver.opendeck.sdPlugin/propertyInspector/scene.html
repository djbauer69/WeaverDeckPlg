<!doctype html>
<html><head><meta charset="utf-8"><title>PipeWeaver Scene Builder</title>
<style>
html,body{margin:0;padding:0;background:#1e1e1e;color:#eee;font:13px sans-serif}body{padding:12px;box-sizing:border-box}.row{display:flex;align-items:center;margin-bottom:10px;gap:8px}.top label{width:72px;color:#bbb}input,select{box-sizing:border-box;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;padding:7px}input[type=text]{flex:1;min-width:0}.toolbar{display:flex;gap:6px;margin:10px 0}.toolbar button,.step button{background:#343434;color:#eee;border:1px solid #555;border-radius:4px;padding:6px 9px;cursor:pointer}.toolbar button:hover,.step button:hover{background:#444}.step{border:1px solid #4a4a4a;border-radius:6px;padding:9px;margin-bottom:9px;background:#242424}.step-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}.step-head select{flex:1}.step-actions{display:flex;gap:4px}.field{display:flex;align-items:flex-start;gap:8px;margin:7px 0}.field label{width:78px;color:#bbb;padding-top:7px}.field>select,.field>input{flex:1;min-width:0}.choices{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;max-height:130px;overflow:auto;padding:5px;border:1px solid #444;border-radius:4px;background:#202020}.choice{display:flex;align-items:center;gap:5px;min-width:0}.choice input{margin:0}.choice span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint,.empty,.legacy{color:#999;font-size:12px;line-height:1.35}.empty{padding:14px 5px;text-align:center;border:1px dashed #555;border-radius:6px}.legacy{padding:8px;border:1px solid #665c2b;background:#332f1b;border-radius:5px;margin-bottom:9px}.summary{color:#bbb;font-size:12px;margin-top:6px}.danger{color:#ffb0b0}
</style>
<script>
let websocket,context,settings={},info,data={sources:[],targets:[]},operations=[];
function connectElgatoStreamDeckSocket(inPort,inPropertyInspectorUUID,inRegisterEvent,inInfo,inActionInfo){websocket=new WebSocket("ws://localhost:"+inPort);context=inPropertyInspectorUUID;info=JSON.parse(inActionInfo);settings=info.payload.settings||{};operations=Array.isArray(settings.operations)?JSON.parse(JSON.stringify(settings.operations)):[];websocket.onopen=()=>{websocket.send(JSON.stringify({event:inRegisterEvent,uuid:inPropertyInspectorUUID}));websocket.send(JSON.stringify({event:"sendToPlugin",context:info.context,payload:{command:"getTargets"}}))};websocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="sendToPropertyInspector"&&m.payload?.command==="targets"){data.sources=m.payload.sources||[];data.targets=m.payload.targets||[];render()}}catch(_){}};document.getElementById("name").value=settings.name||"Scene";render()}
function save(){const payload={name:document.getElementById("name").value||"Scene",sceneVersion:1,operations};if(settings.commands&&!operations.length)payload.commands=settings.commands;websocket?.send(JSON.stringify({event:"setSettings",context:info.context,payload}))}
function addStep(){operations.push({type:"sourceMute",sources:[],mix:"A",state:"muted"});render();save()}
function moveStep(i,d){const j=i+d;if(j<0||j>=operations.length)return;[operations[i],operations[j]]=[operations[j],operations[i]];render();save()}
function removeStep(i){operations.splice(i,1);render();save()}
function setType(i,v){const defaults={sourceMute:{sources:[],mix:"A",state:"muted"},targetMute:{targets:[],state:"muted"},sourceVolume:{sources:[],mix:"A",volume:50},targetVolume:{targets:[],volume:50},targetMix:{targets:[],mix:"A"},route:{sources:[],targets:[],state:"on"}};operations[i]={type:v,...defaults[v]};render();save()}
function setField(i,k,v){operations[i][k]=v;save();renderSummary(i)}
function setChecked(i,k,name,checked){const a=Array.isArray(operations[i][k])?operations[i][k]:[];operations[i][k]=checked?[...new Set([...a,name])]:a.filter(x=>x!==name);save();renderSummary(i)}
function esc(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function multiChoices(i,key,list){const chosen=new Set(operations[i][key]||[]);if(!list.length)return '<div class="choices"><span class="hint">No PipeWeaver channels found.</span></div>';return '<div class="choices">'+list.map(n=>`<label class="choice"><input type="checkbox" ${chosen.has(n)?"checked":""} onchange="setChecked(${i},'${key}',this.dataset.name,this.checked)" data-name="${esc(n)}"><span title="${esc(n)}">${esc(n)}</span></label>`).join("")+'</div>'}
function summary(op){const names=a=>Array.isArray(a)&&a.length?a.join(", "):"none selected";switch(op.type){case"sourceMute":return `${names(op.sources)} • ${op.mix||"A"} • ${op.state==="unmuted"?"Unmute":"Mute"}`;case"targetMute":return `${names(op.targets)} • ${op.state==="unmuted"?"Unmute":"Mute"}`;case"sourceVolume":return `${names(op.sources)} • ${op.mix||"A"} → ${Number(op.volume)||0}%`;case"targetVolume":return `${names(op.targets)} → ${Number(op.volume)||0}%`;case"targetMix":return `${names(op.targets)} → Mix ${op.mix||"A"}`;case"route":return `${names(op.sources)} → ${names(op.targets)} • ${op.state==="off"?"Off":"On"}`;default:return ""}}
function renderSummary(i){const e=document.getElementById("sum"+i);if(e)e.textContent=summary(operations[i])}
function fields(op,i){if(op.type==="sourceMute")return `<div class="field"><label>Sources</label>${multiChoices(i,"sources",data.sources)}</div><div class="field"><label>Channel</label><select onchange="setField(${i},'mix',this.value)"><option ${op.mix!=="B"?"selected":""}>A</option><option ${op.mix==="B"?"selected":""}>B</option></select></div><div class="field"><label>State</label><select onchange="setField(${i},'state',this.value)"><option value="muted" ${op.state!=="unmuted"?"selected":""}>Mute</option><option value="unmuted" ${op.state==="unmuted"?"selected":""}>Unmute</option></select></div>`;
if(op.type==="targetMute")return `<div class="field"><label>Targets</label>${multiChoices(i,"targets",data.targets)}</div><div class="field"><label>State</label><select onchange="setField(${i},'state',this.value)"><option value="muted" ${op.state!=="unmuted"?"selected":""}>Mute</option><option value="unmuted" ${op.state==="unmuted"?"selected":""}>Unmute</option></select></div>`;
if(op.type==="sourceVolume")return `<div class="field"><label>Sources</label>${multiChoices(i,"sources",data.sources)}</div><div class="field"><label>Channel</label><select onchange="setField(${i},'mix',this.value)"><option ${op.mix!=="B"?"selected":""}>A</option><option ${op.mix==="B"?"selected":""}>B</option></select></div><div class="field"><label>Volume</label><input type="number" min="0" max="100" value="${esc(op.volume??50)}" onchange="setField(${i},'volume',Math.max(0,Math.min(100,Number(this.value))))"></div>`;
if(op.type==="targetVolume")return `<div class="field"><label>Targets</label>${multiChoices(i,"targets",data.targets)}</div><div class="field"><label>Volume</label><input type="number" min="0" max="100" value="${esc(op.volume??50)}" onchange="setField(${i},'volume',Math.max(0,Math.min(100,Number(this.value))))"></div>`;
if(op.type==="targetMix")return `<div class="field"><label>Targets</label>${multiChoices(i,"targets",data.targets)}</div><div class="field"><label>Mix</label><select onchange="setField(${i},'mix',this.value)"><option ${op.mix!=="B"?"selected":""}>A</option><option ${op.mix==="B"?"selected":""}>B</option></select></div>`;
if(op.type==="route")return `<div class="field"><label>Sources</label>${multiChoices(i,"sources",data.sources)}</div><div class="field"><label>Targets</label>${multiChoices(i,"targets",data.targets)}</div><div class="field"><label>State</label><select onchange="setField(${i},'state',this.value)"><option value="on" ${op.state!=="off"?"selected":""}>On</option><option value="off" ${op.state==="off"?"selected":""}>Off</option></select></div>`;return""}
function render(){const root=document.getElementById("steps");if(!root)return;let html="";if(settings.commands&&!operations.length)html+='<div class="legacy">This key contains a legacy JSON scene. Add a structured step to replace it. Until then, the existing JSON scene will continue to run.</div>';if(!operations.length)html+='<div class="empty">No scene steps yet. Add a step below.</div>';operations.forEach((op,i)=>{html+=`<div class="step"><div class="step-head"><select onchange="setType(${i},this.value)"><option value="sourceMute" ${op.type==="sourceMute"?"selected":""}>Source Mute / Unmute</option><option value="targetMute" ${op.type==="targetMute"?"selected":""}>Target Mute / Unmute</option><option value="sourceVolume" ${op.type==="sourceVolume"?"selected":""}>Source Set Volume</option><option value="targetVolume" ${op.type==="targetVolume"?"selected":""}>Target Set Volume</option><option value="targetMix" ${op.type==="targetMix"?"selected":""}>Target Mix A / B</option><option value="route" ${op.type==="route"?"selected":""}>Route On / Off</option></select><div class="step-actions"><button onclick="moveStep(${i},-1)" title="Move up">↑</button><button onclick="moveStep(${i},1)" title="Move down">↓</button><button onclick="removeStep(${i})" title="Remove">✕</button></div></div>${fields(op,i)}<div class="summary" id="sum${i}">${esc(summary(op))}</div></div>`});root.innerHTML=html}
</script></head>
<body><div class="row top"><label>Name</label><input id="name" type="text" onchange="save()"></div><div class="hint">Build a deterministic PipeWeaver scene. Each step can control multiple channels, and steps run from top to bottom.</div><div id="steps"></div><div class="toolbar"><button onclick="addStep()">+ Add Step</button></div><div class="hint">Source mute is independent for A/B. Target mute, volumes, mixes and routes use explicit states so running the same scene repeatedly gives the same result.</div></body></html>
