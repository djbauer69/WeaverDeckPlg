name: Materialize v0.7.1 source
on:
  push:
    branches: [main]
    paths: [.github/workflows/materialize-v071.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact v0.7.1 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          root = Path('com.pipeweaver.opendeck.sdPlugin')
          plugin = ''''''
          manifest = ''''''
          (root/'plugin.js').write_bytes(gzip.decompress(base64.b64decode(plugin)))
          (root/'manifest.json').write_bytes(gzip.decompress(base64.b64decode(manifest)))
          PY
      - name: Commit exact files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add com.pipeweaver.opendeck.sdPlugin/plugin.js com.pipeweaver.opendeck.sdPlugin/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize exact v0.7.1 plugin source"
          git push
